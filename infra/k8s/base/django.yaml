apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  labels:
    app.kubernetes.io/name: django
    app.kubernetes.io/part-of: book-lens
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: django
  template:
    metadata:
      labels:
        app.kubernetes.io/name: django
        app.kubernetes.io/part-of: book-lens
    spec:
      containers:
        - name: django
          image: book-lens-django:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: app-secret
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: django
  labels:
    app.kubernetes.io/name: django
    app.kubernetes.io/part-of: book-lens
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: django
  ports:
    - name: http
      port: 8000
      targetPort: 8000
