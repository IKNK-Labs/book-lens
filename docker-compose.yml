name: book-lens

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: book-lens-nginx
    ports:
      - "12090:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - django
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SERVER_API_URL: ${SERVER_API_URL:-http://django:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    image: book-lens-frontend:local
    container_name: book-lens-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SERVER_API_URL: ${SERVER_API_URL:-http://django:8000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    expose:
      - "3000"
    restart: unless-stopped

  django:
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --workers 3
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: book-lens-django:local
    container_name: book-lens-django
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-dev-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost}
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-book_lens}
      DB_USER: ${DB_USER:-book_lens_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the external PostgreSQL database}
      DB_HOST: ${DB_HOST:?Set DB_HOST to the external PostgreSQL host}
      DB_PORT: ${DB_PORT:-5432}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-character-images}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    expose:
      - "8000"
    restart: unless-stopped
